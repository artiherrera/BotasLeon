version: 1
applications:
  - appRoot: storefront
    frontend:
      phases:
        preBuild:
          # La UI de Amplify estaba enviando SHOPIFY_STOREFRONT_ACCESS_TOKEN
          # con valor vacío (TOKEN_present=YES pero length=0). Generamos
          # un .env.production.local que Next.js lee al build, usando los
          # valores de la UI cuando existen y cayendo a defaults committed
          # cuando vienen vacíos. El Storefront token es público por diseño
          # (read-only, scoped a la tienda), así que comitearlo no compromete.
          commands:
            # MERCADO del despliegue: US (botasleon.com) o MX (botasleon.mx).
            # MISMA tienda de Shopify, dos mercados: MX->MXN y US->USD. El país
            # que va en @inContext decide la moneda y el idioma que devuelve
            # Shopify. Ver storefront/src/lib/market.ts.
            - MARKET="${NEXT_PUBLIC_MARKET:-US}"
            # El build hornea los precios Y las URLs canónicas. Un build de MX
            # que se quedara con el SITE_URL de .com publicaría canonicals,
            # sitemap y OG apuntando al sitio equivocado — Google terminaria
            # deduplicando los dos dominios contra el de dolares. Mejor que
            # reviente aqui que descubrirlo cuando ya no rankea.
            - |
              if [ "$MARKET" = "MX" ]; then
                case "${NEXT_PUBLIC_SITE_URL:-}" in
                  *botasleon.mx*) ;;
                  *) echo "MARKET=MX exige NEXT_PUBLIC_SITE_URL en botasleon.mx (recibido: '${NEXT_PUBLIC_SITE_URL:-vacio}')." >&2
                     exit 1 ;;
                esac
              fi
            - TOKEN="${SHOPIFY_STOREFRONT_ACCESS_TOKEN:-a972078fe7ba6fa5a4f2247ba596e2b9}"
            - DOMAIN="${SHOPIFY_STORE_DOMAIN:-botas-leon-3.myshopify.com}"
            - VERSION="${SHOPIFY_API_VERSION:-2025-01}"
            - SITE_URL="${NEXT_PUBLIC_SITE_URL:-https://botasleon.com}"
            - echo "SHOPIFY_STOREFRONT_ACCESS_TOKEN=$TOKEN"               >  .env.production.local
            - echo "SHOPIFY_STORE_DOMAIN=$DOMAIN"                         >> .env.production.local
            - echo "SHOPIFY_API_VERSION=$VERSION"                         >> .env.production.local
            - echo "NEXT_PUBLIC_SITE_URL=$SITE_URL"                       >> .env.production.local
            - echo "NEXT_PUBLIC_MARKET=$MARKET"                           >> .env.production.local
            # Dominio propio para el checkout: Shopify siempre devuelve el host
            # myshopify en headless, y sacar al comprador del dominio de marca
            # justo al pagar cuesta ventas. Ver storefront/src/lib/checkout.ts.
            - echo "NEXT_PUBLIC_CHECKOUT_DOMAIN=${NEXT_PUBLIC_CHECKOUT_DOMAIN:-}" >> .env.production.local
            # NEXT_PUBLIC_* se exponen al bundle del navegador. El cart
            # client-side hace fetch directo desde el browser a Shopify
            # (sin pasar por nuestro server), así que necesita ambos.
            - echo "NEXT_PUBLIC_SHOPIFY_STORE_DOMAIN=$DOMAIN"             >> .env.production.local
            - echo "NEXT_PUBLIC_SHOPIFY_STOREFRONT_ACCESS_TOKEN=$TOKEN"   >> .env.production.local
            - echo "NEXT_PUBLIC_SHOPIFY_API_VERSION=$VERSION"             >> .env.production.local
            # Klaviyo public key (alias Company ID / Site ID) — público por
            # diseño, va al bundle JS para subscriber form + tracking onsite.
            - echo "NEXT_PUBLIC_KLAVIYO_PUBLIC_KEY=STeTJE"                >> .env.production.local
            # Meta Pixel ID — público por diseño (va en el <head> del sitio).
            - echo "NEXT_PUBLIC_META_PIXEL_ID=1797797374966698"           >> .env.production.local
            - echo "=== env injected ==="
            - echo "DOMAIN=$DOMAIN VERSION=$VERSION SITE_URL=$SITE_URL"
            - echo "TOKEN_length=${#TOKEN}"
            - echo "==================="
            # La caché de datos de Next guarda las respuestas de Shopify entre
            # builds. Al cambiar precios o moneda, los builds seguían sirviendo
            # los valores viejos: pasó de verdad —la tienda ya cobraba en pesos
            # y el sitio publicaba dólares convertidos—. Se borra solo la caché
            # de fetch; la del compilador se conserva para no alargar el build.
            - rm -rf .next/cache/fetch-cache
            - npm install
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .next/cache/**/*
          - node_modules/**/*
